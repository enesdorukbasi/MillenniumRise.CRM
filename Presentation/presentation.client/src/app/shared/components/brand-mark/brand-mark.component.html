<div class="brand" [class.brand--inverse]="inverse" [class.brand--compact]="compact">
  <img *ngIf="logoUrl" class="brand__image" [src]="logoUrl" alt="">
  <svg *ngIf="!logoUrl" class="brand__symbol" viewBox="0 0 40 32" aria-hidden="true">
    <path d="M3 28V3l17 14L37 3v25L20 15 3 28Z" fill="currentColor" opacity=".24"></path>
    <path d="M3 3l9 7.5V21L3 28V3Zm34 0-9 7.5V21l9 7V3Z" fill="currentColor"></path>
  </svg>
  <span *ngIf="!compact">{{ name }}</span>
</div>
