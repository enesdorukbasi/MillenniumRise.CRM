<header class="page-header">
  <div><h1>{{ title }}</h1><p *ngIf="description">{{ description }}</p></div>
  <div class="page-header__actions">
    <ng-content select="[pageHeaderAction]"></ng-content>
    <button *ngIf="actionLabel" class="button button--primary" type="button" (click)="action.emit()"><app-icon name="plus" [size]="18"></app-icon>{{ actionLabel }}</button>
  </div>
</header>
