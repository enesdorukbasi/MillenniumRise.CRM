<div class="admin-shell">
  <div *ngIf="sidebarOpen" class="sidebar-overlay" (click)="sidebarOpen = false"></div>
  <aside class="sidebar" [class.sidebar--open]="sidebarOpen" [class.sidebar--collapsed]="sidebarCollapsed">
    <a class="sidebar__brand" routerLink="/dashboard" [title]="programConfiguration()?.name || 'Millennium Rise'" [attr.aria-label]="(programConfiguration()?.name || 'Millennium Rise') + ' ana sayfa'">
      <app-brand-mark [compact]="sidebarCollapsed" [inverse]="true" [nowrap]="true" [fontSize]="sidebarBrandFontSize" [name]="programConfiguration()?.name || 'Millennium Rise'" [logoUrl]="programConfiguration()?.logo?.url || null"></app-brand-mark>
    </a>
    <nav class="sidebar__nav" aria-label="Ana menü">
      <a *ngFor="let item of navigationItems" [routerLink]="item.path" routerLinkActive="sidebar__link--active" class="sidebar__link" [title]="sidebarCollapsed ? item.label : ''">
        <app-icon [name]="item.icon" [size]="20"></app-icon><span>{{ item.label }}</span>
      </a>
    </nav>
    <div class="sidebar__footer">
      <button class="sidebar__collapse" type="button" [attr.aria-label]="sidebarToggleLabel" [attr.aria-expanded]="sidebarExpanded" (click)="toggleSidebar()">
        <app-icon [name]="sidebarToggleIcon" [size]="18"></app-icon><span>{{ sidebarCollapsed ? 'Menüyü genişlet' : 'Menüyü daralt' }}</span>
      </button>
      <div class="theme-control" [class.theme-control--open]="themeMenuOpen" (click)="$event.stopPropagation()">
        <button class="theme-control__compact" type="button" [attr.aria-label]="resolvedTheme() === 'dark' ? 'Açık temaya geç' : 'Koyu temaya geç'" [title]="resolvedTheme() === 'dark' ? 'Açık temaya geç' : 'Koyu temaya geç'" (click)="toggleCollapsedTheme($event)">
          <app-icon [name]="resolvedTheme() === 'dark' ? 'sun' : 'moon'" [size]="18"></app-icon>
        </button>
        <button class="theme-control__trigger" type="button" aria-haspopup="listbox" [attr.aria-expanded]="themeMenuOpen" (click)="toggleThemeMenu($event)">
          <app-icon [name]="themePreferenceIcon" [size]="17"></app-icon>
          <span><small>Tema</small><strong>{{ themePreferenceLabel }}</strong></span>
          <app-icon class="theme-control__chevron" name="chevron-down" [size]="15"></app-icon>
        </button>
        <div class="theme-control__options" role="listbox" aria-label="Tema seçimi">
          <button type="button" role="option" [attr.aria-selected]="themePreference() === 'light'" (click)="selectTheme('light', $event)"><app-icon name="sun" [size]="17"></app-icon><span>Açık</span><app-icon *ngIf="themePreference() === 'light'" name="check" [size]="15"></app-icon></button>
          <button type="button" role="option" [attr.aria-selected]="themePreference() === 'dark'" (click)="selectTheme('dark', $event)"><app-icon name="moon" [size]="17"></app-icon><span>Koyu</span><app-icon *ngIf="themePreference() === 'dark'" name="check" [size]="15"></app-icon></button>
          <button type="button" role="option" [attr.aria-selected]="themePreference() === 'system'" (click)="selectTheme('system', $event)"><app-icon name="monitor" [size]="17"></app-icon><span>Sistem</span><app-icon *ngIf="themePreference() === 'system'" name="check" [size]="15"></app-icon></button>
        </div>
      </div>
      <div class="sidebar__footer-divider"></div>
      <div class="sidebar__date"><app-icon name="calendar" [size]="16"></app-icon><span>{{ currentDateTime }}</span></div>
    </div>
  </aside>

  <section class="admin-main" [class.admin-main--sidebar-collapsed]="sidebarCollapsed">
    <header class="topbar">
      <button class="icon-button topbar__menu" type="button" [attr.aria-label]="sidebarToggleLabel" [attr.aria-expanded]="sidebarExpanded" (click)="toggleSidebar()">
        <app-icon [name]="sidebarToggleIcon" [size]="19"></app-icon>
      </button>
      <div class="topbar__spacer"></div>
      <div class="user-menu" [class.user-menu--open]="userMenuOpen" (click)="$event.stopPropagation()">
        <button class="user-menu__trigger" type="button" aria-haspopup="menu" [attr.aria-expanded]="userMenuOpen" (click)="toggleUserMenu($event)">
          <span class="user-menu__monogram">{{ userInitials }}</span>
          <span class="user-menu__identity">
            <strong>{{ session.user?.fullName || 'Admin' }}</strong>
            <small>{{ session.user?.email || 'E-posta bulunamadı' }}</small>
          </span>
          <app-icon class="user-menu__chevron" name="chevron-down" [size]="16"></app-icon>
        </button>
        <div class="user-menu__dropdown" role="menu">
          <div class="user-menu__summary">
            <span>Oturum açan kullanıcı</span>
            <div class="user-menu__summary-identity">
              <span class="user-menu__monogram user-menu__monogram--small">{{ userInitials }}</span>
              <span><strong>{{ session.user?.fullName || 'Admin' }}</strong><small>{{ session.user?.email || 'E-posta bulunamadı' }}</small></span>
            </div>
          </div>
          <button class="user-menu__logout" type="button" role="menuitem" (click)="logout()">
            <app-icon name="logout" [size]="18"></app-icon><span>Çıkış Yap</span>
          </button>
        </div>
      </div>
    </header>
    <main class="page-content"><router-outlet></router-outlet></main>
  </section>
</div>
